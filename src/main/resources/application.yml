spring:
  application:
    name: crm

  # PostgreSQL 数据源（与 docker/docker-compose.yml 中 postgres-crm 服务保持一致）
  datasource:
    url: jdbc:postgresql://localhost:5432/yzb
    username: yzb_user
    password: YZB_DB2026
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

# JWT 认证配置（默认值仅用于本地开发，生产环境务必通过环境变量覆盖）
crm:
  jwt:
    # HS256 签名密钥：长度必须 >= 32 字节
    secret: ${JWT_SECRET:yzb-crm-2026-jwt-signing-key-must-be-at-least-32-bytes-0123456789}
    # Token 有效期（毫秒），默认 24 小时
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

