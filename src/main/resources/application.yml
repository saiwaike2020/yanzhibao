spring:
  application:
    name: crm
  # 默认激活 profile：dev（开发环境）；生产环境用 SPRING_PROFILES_ACTIVE=prod 覆盖
  profiles:
    default: dev

  # PostgreSQL 数据源（与 docker/docker-compose.yml 中 postgres-crm 服务保持一致）
  datasource:
    url: jdbc:postgresql://localhost:5432/yzb
    username: yzb_user
    password: YZB_DB2026
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

# JWT 认证配置（默认值仅用于本地开发，生产环境务必通过环境变量覆盖）
crm:
  jwt:
    # HS256 签名密钥：长度必须 >= 32 字节
    secret: ${JWT_SECRET:yzb-crm-2026-jwt-signing-key-must-be-at-least-32-bytes-0123456789}
    # Token 有效期（毫秒），默认 24 小时
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# LangChain4j / LLM 配置示例（按需启用对应模型提供方，如 OpenAI、DashScope 等）
# langchain4j:
#   open-ai:
#     chat-model:
#       api-key: ${OPENAI_API_KEY}
#       model-name: gpt-4o-mini

# =============================================================================
# 日志配置
# =============================================================================
logging:
  # 日志文件存储根目录：logback-spring.xml 读取该属性（springProperty），
  # 可用环境变量 LOG_PATH 覆盖（如 LOG_PATH=/var/log/crm），默认 logs/
  file:
    path: ${LOG_PATH:logs}
  # 根级别与包级别（dev / prod 的具体差异见下方 profile 段）
  level:
    root: INFO
    com.crm: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.apache: WARN
    com.zaxxer.hikari: WARN

# ---------------- dev profile：开发环境（默认，开启 DEBUG 便于排查） ----------------
---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    root: DEBUG
    com.crm: DEBUG
    org.springframework: WARN
    org.hibernate: WARN
    org.hibernate.SQL: DEBUG    # 打印 JPA/Hibernate 生成的 SQL
    com.zaxxer.hikari: WARN

# ---------------- prod profile：生产环境（仅 INFO 及以上） ----------------
---
spring:
  config:
    activate:
      on-profile: prod
logging:
  level:
    root: INFO
    com.crm: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.hibernate.SQL: WARN     # 生产不打印 SQL
    com.zaxxer.hikari: WARN
