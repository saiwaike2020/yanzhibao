<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘记密码 / 密码重置测试</title>
    <style>
        body { font-family: "Microsoft YaHei", system-ui, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; color: #222; }
        h1 { font-size: 22px; }
        .note { background: #fff7e6; border: 1px solid #ffd591; border-radius: 8px; padding: 10px 14px; color: #874d00; }
        section { margin-top: 24px; border: 1px solid #e0e0e0; border-radius: 10px; padding: 16px; }
        h2 { font-size: 16px; margin: 0 0 12px; }
        form { display: flex; flex-direction: column; gap: 10px; }
        label { display: flex; flex-direction: column; font-size: 13px; color: #555; gap: 4px; }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        button { padding: 10px; border: none; border-radius: 6px; background: #1677ff; color: #fff; font-size: 15px; cursor: pointer; }
        button:hover { background: #0958d9; }
        .out { background: #f6f8fa; border-radius: 6px; padding: 12px; font-size: 13px; white-space: pre-wrap; word-break: break-all; min-height: 40px; margin-top: 12px; }
        .tip { font-size: 12px; color: #888; margin-top: 8px; }
    </style>
</head>
<body>
<h1>🔑 忘记密码 / 手机号验证码重置密码测试（UC-025 / 设计文档 4.7）</h1>
<div class="note">⚠️ 当前短信为 <b>Mock 通道</b>，验证码固定为 <b>000000</b>，有效期 5 分钟、同一手机号 60 秒内仅可发送一次。</div>

<section>
    <h2>1️⃣ 发送重置密码验证码（scene=RESET_PWD）</h2>
    <form id="form-sms">
        <label>手机号（须为已注册账号）<input name="phone" required placeholder="13800001111"></label>
        <button type="submit">发送验证码</button>
    </form>
    <pre id="out-sms" class="out">（响应将显示在这里）</pre>
</section>

<section>
    <h2>2️⃣ 手机号 + 验证码重置密码</h2>
    <form id="form-reset">
        <label>手机号 <input name="phone" required placeholder="13800001111"></label>
        <label>短信验证码 <input name="smsCode" required value="000000"></label>
        <label>新密码（≥8 位，需包含字母和数字）<input name="newPassword" required value="xyz67890"></label>
        <button type="submit">重置密码</button>
    </form>
    <pre id="out-reset" class="out">（响应将显示在这里）</pre>
    <div class="tip">重置成功后不自动签发 Token，请使用新密码重新登录。</div>
</section>

<script>
    async function postJson(url, body) {
        const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const text = await res.text();
        try {
            return JSON.stringify(JSON.parse(text), null, 2);
        } catch {
            return text;
        }
    }

    document.getElementById('form-sms').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const body = { phone: fd.get('phone').trim(), scene: 'RESET_PWD' };
        const out = document.getElementById('out-sms');
        out.textContent = '请求中...';
        out.textContent = await postJson('/api/sms/verification-code', body);
    });

    document.getElementById('form-reset').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const body = {
            phone: fd.get('phone').trim(),
            smsCode: fd.get('smsCode').trim(),
            newPassword: fd.get('newPassword')
        };
        const out = document.getElementById('out-reset');
        out.textContent = '请求中...';
        out.textContent = await postJson('/api/auth/password/reset', body);
    });
</script>
</body>
</html>
